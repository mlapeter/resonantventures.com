<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resonant Ventures</title>
<meta name="description" content="Resonant Ventures is a small software company building AI-first products.">
<meta name="theme-color" content="#0a0f17">
<meta property="og:type" content="website">
<meta property="og:title" content="Resonant Ventures">
<meta property="og:description" content="A small software company building AI-first products.">
<meta property="og:url" content="https://resonantventures.com/">
<meta property="og:image" content="https://resonantventures.com/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
  color-scheme: dark;
  --night: #0a0f17; --fg: #e7ecf3; --muted: #8794a6; --accent: #6f9bd6;
  --display: "Sora", "Avenir Next", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--night); color: var(--fg); font: 16px/1.55 var(--display); -webkit-font-smoothing: antialiased; }
.page { display: grid; grid-template-rows: 1fr auto; min-height: 100vh; min-height: 100svh;
  background: radial-gradient(ellipse 70% 55% at 50% 42%, #13213b 0%, var(--night) 70%);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
main { display: grid; justify-items: center; align-content: center; gap: 22px; text-align: center; padding-block: 56px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { margin: 10px 0 0; font-size: clamp(28px, 4.4vw, 40px); font-weight: 600; letter-spacing: .01em; line-height: 1.1; }
p { margin: 0; color: var(--muted); max-width: 40ch; text-wrap: balance; font-size: 18px; }
.mail { font: 15px/1 var(--mono); margin-top: 10px; }
.mail a { color: var(--fg); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
.mail a:hover { color: var(--accent); }
.mail a:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; border-radius: 2px; }
footer { font: 12px/1.4 var(--mono); color: var(--muted); text-align: center; padding-block: 22px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.mark { width: min(62vw, 360px); aspect-ratio: 1; max-width: 100%; position: relative; perspective: 600px; transform-style: preserve-3d; }
.mark .spin { position: absolute; inset: 0; transform-style: preserve-3d; }
.mark svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.mark .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
</style>
</head>
<body>
<div class="page">
  <main>
    <div class="mark" id="mark" role="img" aria-label="Resonant Ventures logo"></div>
    <h1>Resonant Ventures</h1>
    <p>A small software company building AI-first products.</p>
    <div class="mail"><a href="mailto:hi@resonantventures.com">hi@resonantventures.com</a></div>
  </main>
  <footer>&copy; 2026 Resonant Ventures</footer>
</div>
<script>
(() => {
  const GEO = {
    outer: { pts: [[80,30],[30,80],[30,160],[30,240],[80,290]], w: 27, kind: 'navy' },
    mid:   { pts: [[120,78],[89,109],[89,160],[89,211],[120,242]], w: 22, kind: 'slate' },
    inner: { pts: [[143,124],[127,140],[127,160],[127,180],[143,196]], w: 12, kind: 'navy' },
  };
  const PAL = { navyHi:'#6a9be0', navy:'#3d70ba', navyLo:'#1b3c70', slateA:'#7f8ca0', glow:'#4d86dc', glowOp:.55, rim:'rgba(255,255,255,.45)' };
  const sub = (a,b) => [a[0]-b[0], a[1]-b[1]];
  const nrm = v => { const l = Math.hypot(v[0],v[1]); return [v[0]/l, v[1]/l]; };
  function offset(pts, d) {
    const N = pts.length, segs = [];
    for (let i = 0; i < N-1; i++) { const u = nrm(sub(pts[i+1], pts[i])); segs.push({ u, n: [-u[1], u[0]] }); }
    const out = [];
    for (let j = 0; j < N; j++) {
      if (j === 0 || j === N-1) { const s = segs[j === 0 ? 0 : N-2]; out.push([pts[j][0]+s.n[0]*d, pts[j][1]+s.n[1]*d]); continue; }
      const a = segs[j-1], b = segs[j];
      const cross = a.u[0]*b.u[1] - a.u[1]*b.u[0];
      if (Math.abs(cross) < 1e-6) { out.push([pts[j][0]+b.n[0]*d, pts[j][1]+b.n[1]*d]); continue; }
      const p = [pts[j-1][0]+a.n[0]*d, pts[j-1][1]+a.n[1]*d], q = [pts[j][0]+b.n[0]*d, pts[j][1]+b.n[1]*d];
      const t = ((q[0]-p[0])*b.u[1] - (q[1]-p[1])*b.u[0]) / cross;
      out.push([p[0]+a.u[0]*t, p[1]+a.u[1]*t]);
    }
    return { pts: out, segs };
  }
  const mir = poly => poly.map(([x,y]) => [320-x, y]);
  const P = poly => poly.map(p => p[0].toFixed(2)+','+p[1].toFixed(2)).join(' ');
  const outline = key => { const g = GEO[key], h = g.w/2; return offset(g.pts, h).pts.concat(offset(g.pts, -h).pts.reverse()); };
  const hex = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
  const toHex = c => '#' + c.map(v => Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  const mix = (a,b,t) => toHex(hex(a).map((v,i) => v + (hex(b)[i]-v)*t));
  const shade = (c, s) => s >= 0 ? mix(c, '#ffffff', s) : mix(c, '#000000', -s);

  let uid = 0;
  function fillDefs(key, pal, id) {
    const g = GEO[key], y0 = g.pts[0][1] - g.w/2, y1 = g.pts[g.pts.length-1][1] + g.w/2;
    if (g.kind === 'slate') return `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="0" y1="${y0}" x2="0" y2="${y1}">
      <stop offset="0" stop-color="${shade(pal.slateA,.1)}"/><stop offset="1" stop-color="${shade(pal.slateA,-.12)}"/></linearGradient>`;  
    return `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="40" y1="${y0}" x2="200" y2="${y1}">
      <stop offset="0" stop-color="${pal.navyHi}"/><stop offset=".55" stop-color="${pal.navy}"/><stop offset="1" stop-color="${pal.navyLo}"/></linearGradient>`;
  }
  function lit(key, pal) {
    const g = GEO[key], id = 'l'+(uid++), o = outline(key), om = mir(o), edge = offset(g.pts, g.w/2 - 1.1).pts;
    return `<defs>${fillDefs(key,pal,id)}<filter id="${id}b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter></defs>
      <g fill="${pal.glow}" opacity="${pal.glowOp}" filter="url(#${id}b)"><polygon points="${P(o)}"/><polygon points="${P(om)}"/></g>
      <g fill="url(#${id})"><polygon points="${P(o)}"/><polygon points="${P(om)}"/></g>
      <g fill="none" stroke="${pal.rim}" stroke-width="1.4"><polyline points="${P(edge)}"/><polyline points="${P(mir(edge))}"/></g>`;
  }
  // Each pair spins on the shared vertical axis. Front and back faces are drawn so the logo looks the same at the half turn.
  // Speeds are whole multiples (middle reversed), so all three line up into the logo together every half turn of the outer pair.
  const DIR = { outer: 1, mid: -1, inner: 1 }, SPEED = { outer: 1, mid: 2, inner: 3 };
  const pair = k => ['', ' rotateY(180deg)'].map(back =>
    `<svg class="face" viewBox="0 0 320 320" aria-hidden="true" style="transform:translateZ(${back ? -.5 : .5}px)${back}">${lit(k, PAL)}</svg>`).join('');

  const mark = document.getElementById('mark'), spins = {};
  mark.innerHTML = ['outer','mid','inner'].map(k => `<div class="spin" data-k="${k}">${pair(k)}</div>`).join('');
  mark.querySelectorAll('.spin').forEach(s => spins[s.dataset.k] = s);

  // 24s per full turn of the outer pair. Speed eases to 0.7x each time the pairs line up (front or back) and 1.3x edge-on.
  const TURN = 24, SLOW = .3;
  const prof = x => x - SLOW * Math.sin(2 * Math.PI * x) / (2 * Math.PI);
  const rm = matchMedia('(prefers-reduced-motion: reduce)');
  let phase = 0, last = performance.now();
  function frame(now) {
    const dt = Math.min(.1, (now - last) / 1000); last = now;
    if (!rm.matches) phase += dt / (TURN / 2);  // phase counts half turns
    const ang = prof(phase % 1) * 180 + Math.floor(phase) * 180;
    for (const k in spins) spins[k].style.transform = `rotateY(${(DIR[k] * SPEED[k] * ang).toFixed(3)}deg)`;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
